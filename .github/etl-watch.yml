# Watch list for scripts/check_etl_drift.py — the source-doc drift detector.
#
# Source docs under docs/model/sources/ describe a mapping that is *implemented*
# in another repository (IFRCGo/pystac-monty). When a transformer there changes
# an item id format, a field carriage, a hazard-code crosswalk or how many items
# a source record produces, the doc here silently becomes wrong. This file tells
# the detector what to watch and how far it has already been reviewed.
#
# The transformer path itself is NOT repeated here: it is derived from the `etl`
# URL each source already declares in docs/model/sources/sources.yml, which
# stays the single source of truth. This file only adds what that URL can't say.
#
# Run `python scripts/check_etl_drift.py --dry-run` to see what would be
# reported, and `--check-config` to validate this file against sources.yml
# (that is what CI runs — no network needed).
#
# Field reference:
#   repo         - upstream repository holding the transformers
#   defaults     - issue labels, and who gets assigned when the upstream author
#                  can't be assigned in this repo (not a collaborator here)
#   sources.<id> - keyed by the same `id` as in sources.yml
#     extra_paths - additional upstream files that carry documented behaviour.
#                   Validators are listed because they define the source object
#                   model the doc's field tables describe. Shared modules
#                   (sources/common.py, hazard_profiles.py) are deliberately
#                   NOT watched: a change there touches every source at once and
#                   is reviewed as a model change, not as per-source doc drift.
#     reviewed    - upstream commit the source doc was last checked against.
#                   Everything after it is candidate drift. Bump it (to the sha
#                   named in the drift issue) in the PR that updates the doc,
#                   and close the issue in that PR.
#     regenerate  - optional, and the stronger check of the two:
#                   scripts/check_example_drift.py re-runs the real transformer
#                   over `input` and asserts the committed examples/ items still
#                   come out of it unchanged.
#                     batch - name registered in pystac_monty.sources.
#                             batch_export.BATCH_EXPORTS upstream
#                     input - fixture in this repo, file or directory, in the
#                             native shape that exporter expects
#                     covers - optional id globs, when the fixture only covers
#                             part of the source's worked examples
#                   Only a few sources can declare it today: the exporter must
#                   exist upstream (currently cems, gdacs, gfd, glide) and the
#                   fixture must be machine-readable — several early fixtures
#                   were saved from a browser and start with a `// timestamp`
#                   preamble, which is not JSON. Recapturing one is the cheapest
#                   way to widen this coverage.

repo: IFRCGo/pystac-monty

defaults:
  labels: [documentation, etl-drift]
  fallback_assignees: [emmanuelmathot]

# Bootstrapped 2026-07-29 at IFRCGo/pystac-monty@34b757c ("Merge pull request
# #179"), i.e. the docs are *declared* current as of that commit and the
# detector reports from there on. To sweep the backlog before it, run the
# script once with --since <older-sha-or-date>.
sources:
  cems:
    extra_paths: [pystac_monty/validators/cems.py]
    reviewed: e4fc88b3d30c2e7d7d0ac359de6bd24096e972cd
    regenerate:
      batch: cems
      input: docs/model/sources/CEMS/api-files

  charter:
    extra_paths: [pystac_monty/validators/charter.py]
    reviewed: e4fc88b3d30c2e7d7d0ac359de6bd24096e972cd

  desinventar:
    extra_paths: [pystac_monty/validators/desinventar.py]
    reviewed: e4fc88b3d30c2e7d7d0ac359de6bd24096e972cd

  emdat:
    extra_paths: [pystac_monty/validators/em_dat.py]
    reviewed: 34b757cf114ec4c8d3c1a7412dd9213602fe291c

  gdacs:
    extra_paths:
      - pystac_monty/validators/gdacs_events.py
      - pystac_monty/validators/gdacs_geometry.py
      - pystac_monty/validators/gdacs_impacts.py
    reviewed: 34b757cf114ec4c8d3c1a7412dd9213602fe291c
    regenerate:
      batch: gdacs
      input: docs/model/sources/GDACS/regenerate-bundle.json
      # The bundle holds one event (the 2024 Spanish DANA floods, 1102983).
      # examples/gdacs-*/1001230-41.json is a different event with no committed
      # fixture, so it is out of scope until one is captured.
      covers: ["*1102983*"]

  gfd:
    extra_paths: [pystac_monty/validators/gfd.py]
    reviewed: 34b757cf114ec4c8d3c1a7412dd9213602fe291c

  glide:
    extra_paths: [pystac_monty/validators/glide.py]
    reviewed: e4fc88b3d30c2e7d7d0ac359de6bd24096e972cd

  ibtracs:
    extra_paths: [pystac_monty/validators/ibtracs.py]
    reviewed: 34b757cf114ec4c8d3c1a7412dd9213602fe291c

  idmc-gidd:
    extra_paths: [pystac_monty/validators/gidd.py]
    reviewed: 34b757cf114ec4c8d3c1a7412dd9213602fe291c

  idmc-idu:
    extra_paths: [pystac_monty/validators/idu.py]
    reviewed: 34b757cf114ec4c8d3c1a7412dd9213602fe291c

  ifrcevent:
    extra_paths: [pystac_monty/validators/ifrc.py]
    reviewed: 34b757cf114ec4c8d3c1a7412dd9213602fe291c

  pdc:
    extra_paths: [pystac_monty/validators/pdc.py]
    reviewed: e4fc88b3d30c2e7d7d0ac359de6bd24096e972cd

  usgs:
    extra_paths: [pystac_monty/validators/usgs.py]
    reviewed: 34b757cf114ec4c8d3c1a7412dd9213602fe291c
