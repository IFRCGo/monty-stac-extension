</style><text data-v-df257a48="" x="40" y="28" class="h">Occurrence — has a time</text><line data-v-df257a48="" x1="60" y1="160" x2="450" y2="160" class="axis"></line><line data-v-df257a48="" x1="250" y1="70" x2="250" y2="200" class="now"></line><text data-v-df257a48="" x="250" y="62" text-anchor="middle" class="m">issue time</text><g data-v-df257a48=""><circle data-v-df257a48="" cx="90" cy="160" r="8" fill="#cf3f02" stroke="#cf3f02" stroke-width="2.5"><title data-v-df257a48="">25 Jul 06h — observed</title></circle><text data-v-df257a48="" x="90" y="188" text-anchor="middle" class="s">25 Jul 06h</text></g><g data-v-df257a48=""><circle data-v-df257a48="" cx="170" cy="160" r="8" fill="#cf3f02" stroke="#cf3f02" stroke-width="2.5"><title data-v-df257a48="">25 Jul 18h — observed</title></circle><text data-v-df257a48="" x="170" y="188" text-anchor="middle" class="s">25 Jul 18h</text></g><g data-v-df257a48=""><circle data-v-df257a48="" cx="250" cy="160" r="8" fill="#cf3f02" stroke="#cf3f02" stroke-width="2.5"><title data-v-df257a48="">26 Jul 00h — observed</title></circle><text data-v-df257a48="" x="250" y="188" text-anchor="middle" class="s">26 Jul 00h</text></g><g data-v-df257a48=""><circle data-v-df257a48="" cx="330" cy="160" r="8" fill="#fff" stroke="#cf3f02" stroke-width="2.5"><title data-v-df257a48="">26 Jul 12h — forecast</title></circle><text data-v-df257a48="" x="330" y="188" text-anchor="middle" class="s">26 Jul 12h</text></g><g data-v-df257a48=""><circle data-v-df257a48="" cx="410" cy="160" r="8" fill="#fff" stroke="#cf3f02" stroke-width="2.5"><title data-v-df257a48="">27 Jul 00h — forecast</title></circle><text data-v-df257a48="" x="410" y="188" text-anchor="middle" class="s">27 Jul 00h</text></g><text x="170" y="130" text-anchor="middle" class="m" data-v-df257a48="">observed</text><text x="370" y="130" text-anchor="middle" class="m" data-v-df257a48="">forecast</text><rect x="60" y="222" width="390" height="46" rx="6" class="note" data-v-df257a48=""></rect><tex