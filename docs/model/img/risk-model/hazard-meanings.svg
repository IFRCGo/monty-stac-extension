/title></circle><text data-v-df257a48="" x="740" y="130.4" text-anchor="end" class="s">1 map</text></g><g data-v-df257a48=""><circle data-v-df257a48="" cx="900" cy="82.80000000000001" r="6" fill="#cf3f02" stroke="#fff" stroke-width="2"><title data-v-df257a48="">1-in-1000-year flood: 2.3 m (illustrative)</title></circle><text data-v-df257a48="" x="890" y="72.80000000000001" text-anchor="end" class="s">1 map</text></g><text data-v-df257a48="" x="750" y="292" text-anchor="middle" class="s"><tspan data-v-df257a48="" font-weight="700">Case B</tspan> — one map per return period · never an event</text></svg>
