<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Monty in one picture: disaster data sources are mapped to one data model, and written as STAC with the Monty extension">
<style>
svg { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
.h { font-size: 24px; font-weight: 800; fill: #ffffff; }
