<rect x="0" y="0" width="880" height="340" rx="14" fill="#0f2540"/>
<text x="24" y="46" class="h">Many sources. One model. One STAC catalogue.</text>
<text x="24" y="72" class="sub">Monty turns disaster data feeds into data that you can search and compare.</text>
